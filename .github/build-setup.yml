- name: Fetch project dependencies
  run: sh ./scripts/fetch-dependencies.sh
- name: Install license reporter
  run: cargo install cargo-about --locked --features cli --version 0.9.3
- name: Verify dependency licenses
  run: ./scripts/generate-third-party-licenses.ps1 -Check
- name: Install standard-library notices
  run: rustup component add rust-docs
- name: Verify standard-library notices
  run: python scripts/generate-rust-notices.py --check
