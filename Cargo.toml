[workspace]
members = ["crates/rife-core", "crates/rife-cli"]
default-members = ["crates/rife-cli"]
resolver = "2"

[workspace.package]
authors = ["Voximir"]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
cmake = "0.1"
console = "0.16"
ctrlc = "3"
dunce = "1"
fs2 = "0.4"
rife-core = { path = "crates/rife-core" }
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
