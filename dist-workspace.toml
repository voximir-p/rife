[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
github-build-setup = "../build-setup.yml"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-pc-windows-msvc"]
# A git-only tarball omits the statically linked dependency sources.
source-tarball = false
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
auto-includes = false
include = ["README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD-PARTY-LICENSES.html", "LICENSES/"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[[dist.extra-artifacts]]
artifacts = ["target/rife-source.tar.gz"]
build = ["python3", "scripts/package-source.py"]
